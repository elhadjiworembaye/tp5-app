name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -v

      - name: Set image tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/tp5-app:${{ steps.vars.outputs.sha_short }} -t ${{ secrets.DOCKERHUB_USERNAME }}/tp5-app:latest .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/tp5-app:${{ steps.vars.outputs.sha_short }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/tp5-app:${{ steps.vars.outputs.sha_short }} && docker push ${{ secrets.DOCKERHUB_USERNAME }}/tp5-app:latest

      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          repository: elhadjiworembaye/tp5-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: tp5-config

      - name: Update image tag in deployment.yaml
        run: |
          cd tp5-config
          sed -i "s|image: .*|image: ${{ secrets.DOCKERHUB_USERNAME }}/tp5-app:${{ steps.vars.outputs.sha_short }}|" deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployment.yaml
          git commit -m "Deploy tp5-app:${{ steps.vars.outputs.sha_short }}"
          git push
